version = "0.1.0"
description = "Code and notes taken from freeCodeCamp course in video format - most code was written by Lance Martin (from LangChain)"
authors = ["Dickson Souza <36424026+disouzam@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
package-mode= false

[tool.poetry.dependencies]
python = "^3.12"
marimo = "^0.11.11"
langchain-community = "^0.3.18"
tiktoken = "^0.9.0"
langchain-openai = "^0.3.7"
langchainhub = "^0.1.21"
chromadb = "^0.6.3"
